# Session configuration for the Emotion/Stress/Attention collection protocol.
# Durations are full-session values; --demo-scale multiplier can speed through it for a demo run (see app/config/loader.py).

session:
  total_duration_min: 58   # sum of prep/familiarization/emotion/breaks/stress/attention-focus budgets; sart_task is separate and not included
  random_seed: null   # unused -- rng is seeded from session start time; actual seed recorded in each session's session_manifest.json
  participant_id: null   # fallback used only when --participant-id (CLI) is omitted; one of the two is required

preparation:
  duration_min: 10

familiarization:
  duration_min: 3

breaks:
  after_task1_min: 1
  after_task2_min: 1   # between the stress task and the attention/focus task

debrief:
  duration_min: 0   # conclusion screen is self-paced (SPACE to continue), not a real timed block

attention_task:
  # Legacy/standalone test block (spatial n-back retired, OpenMATB not wired into the active session flow) -- see attention_focus_task/sart_task for the tasks actually run in-session.
  duration_min: 15
  cue_duration_sec: 5
  practice_duration_sec: 60       # untimed practice run, not part of the scored dataset
  block_duration_sec: 720         # continuous scored run length (12 min)
  openmatb:
    install_path: vendor/OpenMATB    # external checkout, gitignored -- see README "Attention task (OpenMATB)"
    subtasks: [sysmon, resman]       # keyboard-only: no joystick available for the `track` plugin
    language: en_EN
    fullscreen: false
    screen_index: 0
    sysmon_alerttimeout_ms: 10000          # how long an unaddressed failure stays active before auto-clearing as a MISS
    sysmon_feedback_duration_ms: 1500
    sysmon_failure_interval_range_sec: [10, 20]   # spacing between induced sysmon failures

emotion_task:
  duration_min: 24   # controlled time only (clip length + rest + block baseline); self-paced rating time is excluded
  valence_groups: [positive, negative, neutral]
  clips_per_group: { positive: 3, negative: 3, neutral: 4 }   # clips selected per valence group
  num_blocks: 3   # blocks the interleaved layout splits selected clips into (block_structure: interleaved only)
  fixation_duration_sec: 5   # unused by the active web player; kept only for the retired psychopy emotion_faced.py path
  rest_duration_sec: 5
  block_baseline:   # physiological-baseline touchpoints per block (start/mid/end), replacing per-clip fixation
    start_sec: 60
    mid_sec: 10
    end_sec: 15
  rating_duration_sec: 30   # dead config -- ratings screen is fully self-paced, this value isn't read anywhere in code
  rating_scale_min: 1
  rating_scale_max: 7
  rating_items: [valence, arousal, liking]
  dominance_enabled: false        # config-toggleable 4th rating item
  manifest_path: app/config/emotion_manifest.json
  clip_selection_mode: fixed   # fixed = same clips every participant; `random` restores per-participant random sampling from the full manifest
  fixed_clips_path: app/config/emotion_fixed_clips.json
  familiarization_clip_id: clip_57   # neutral preview clip, not part of the real-task clip set
  block_structure: interleaved   # interleaved mixes valence groups per block; `grouped_by_valence` uses one valence per block

stress_task:
  duration_min: 6   # raindrop alone: trial_order (3 trials) x (baseline_duration_sec + arithmetic_duration_sec)
  baseline_duration_sec: 10
  arithmetic_duration_sec: 60
  baseline_mode: per_trial   # per_trial = fresh baseline+pause before every tier; `once` = single baseline, then tiers run back-to-back
  hurry_up_threshold_fraction: 0.8  # unused by the raindrop game (stress_raindrop.py); kept for app/tasks/stress_mat.py
  high_score_path: sessions/raindrop_high_scores.json   # cross-participant running high score, persists across the whole study
  demo_duration_sec: 20   # familiarization preview: auto-solved demo using tier 1's pacing
  trial_order: [1, 2, 3]   # tier sequence in presentation   order; repeat an id to run a tier more than once
  tiers:   # difficulty comes entirely from time pressure -- arithmetic complexity is identical across all tiers
    - id: 1
      operators: ["+", "-", "*", "/"]
      num_operands: 2
      two_digit_first_operand_fraction: 0.65   # fraction of questions where the first operand is two-digit vs single-digit
      spawn_interval_sec: 3.0   # gap between drop spawns -- lower = harder
      fall_duration_sec: 3.0    # time to answer before a drop is missed -- lower = harder
    - id: 2
      operators: ["+", "-", "*", "/"]
      num_operands: 2
      two_digit_first_operand_fraction: 0.65
      spawn_interval_sec: 2.5
      fall_duration_sec: 2.7
    - id: 3
      operators: ["+", "-", "*", "/"]
      num_operands: 2
      two_digit_first_operand_fraction: 0.65
      spawn_interval_sec: 2.0
      fall_duration_sec: 2.4
  # Tier identity is never shown on screen -- logged to the event log only.

attention_highway_task:
  duration_min: 4   # second half of the stress task, runs right after raindrop within "TASK 3: STRESS"
  lanes: 4   # game.js guarantees at least one lane is always free of any live hazard
  baseline_duration_sec: 5   # idle driving, no hazards -- physiological baseline
  demo_duration_sec: 20   # familiarization preview: auto-dodging demo using tier 1's pacing
  trial_order: [1, 2, 3]   # tier sequence; starts easy and ramps harder
  tiers:
    - id: 1
      label: tier_1
      nominal_difficulty: 1   # experimenter-set induction level, logged verbatim on every event this tier produces
      duration_sec: 60
      spawn_interval_range_sec: [1.0, 1.2]   # jittered gap between hazards -- lower = harder
      fall_duration_sec: 2.0   # reaction window before a hazard reaches the player -- lower = harder
      # CAP on hazards per wave, not a fixed count -- game.js's scheduleNext()
      # rolls each wave's actual size between 1 and this value (every wave
      # spawning exactly this many read as suspiciously uniform/predictable,
      # participant feedback 2026-08-13). Kept at lanes-1 (not lanes):
      # game.js's pickSpawnLane() never lets a wave threaten more than
      # lanes-1 lanes at once (one lane must always stay clear), so setting
      # this equal to `lanes` just forces one lane to always take two
      # simultaneous, perfectly-overlapping obstacles every wave -- a single
      # visual hazard silently double-scored as two independent avoided/
      # collision trials (bug reported by a participant 2026-08-13, fixed by
      # capping this at lanes-1 instead).
      concurrent_obstacles: 3
    - id: 2
      label: tier_2
      nominal_difficulty: 2
      duration_sec: 60
      spawn_interval_range_sec: [0.7, 0.9]
      fall_duration_sec: 1.5
      concurrent_obstacles: 3
    - id: 3
      label: tier_3
      nominal_difficulty: 3
      duration_sec: 60
      spawn_interval_range_sec: [0.3, 0.5]
      fall_duration_sec: 1.0
      concurrent_obstacles: 3
  camp_grace_sec: 0.3     # time sitting in one lane before the anti-camping hazard-nudge probability starts ramping
  camp_ramp_sec: 0.2      # time after camp_grace_sec to reach camp_max_probability
  camp_max_probability: 1.0

  self_report:   # post-block self-report; empty/omitted `items` disables it entirely
    items: [stress, workload, perceived_control, engagement, perceived_difficulty]
    scale_min: 1
    scale_max: 7

  state_tick_hz: 10   # fixed-rate gameplay state stream frequency; 0 disables it
  rolling_window_sec: 15   # window over which recent avoidance/collision rate and reaction time are computed
  near_miss_window_sec: 0.3   # a dodge counts as a near-miss if less than this many seconds of runway remained
  frame_drop_threshold_ms: 50   # rendered frame gap above this logs a frame_drop_warning
  frame_drop_min_gap_sec: 0.5   # debounce between frame_drop_warning logs
  sync_checkpoint_count: 3   # clock-correspondence probes, run at session start and again at session end
  sync_checkpoint_gap_sec: 0.2

attention_focus_task:
  # Schulte table + Stroop color-word test -- untimed/self-paced, no difficulty tiers (see app/tasks/attention_focus.py).
  duration_min: 6   # estimate: trials_per_game trials of each game, ~46s/trial (15s baseline + ~31s avg game)
  trials_per_game: 3
  baseline_duration_sec: 10   # fixation before every trial
  schulte:
    grid_size: 5   # 5x5 grid, numbers 1-25 (classic Schulte table size)
    show_target_hint: true   # shows which number comes next; set false for the strict classic (no on-screen hint) version
    demo_grid_size: 3   # familiarization preview grid size (self-solving demo)
  stroop:
    colors:
      - { name: red, hex: "#e74c3c" }
      - { name: green, hex: "#2ecc71" }
      - { name: blue, hex: "#3498db" }
      - { name: yellow, hex: "#f1c40f" }
      - { name: purple, hex: "#9b59b6" }
      - { name: pink, hex: "#ff69b4" }
    trials_per_block: 20   # fixed number of stimuli per Stroop trial-block
    congruent_fraction: 0.15   # fraction of trials where word text == ink color; rest incongruent, order shuffled
    isi_sec: 0.5   # blank inter-stimulus interval between one response and the next stimulus onset
    demo_trials: 6   # familiarization preview trial count (auto-answered)

sart_task:
  # SART (Sustained Attention to Response Task) -- separate task, run only via `python -m app.run_task --task sart`; not wired into the main session flow or its time budget.
  duration_min: 4   # baseline (baseline_duration_sec) + practice (18 trials, ~2.05s/trial w/ feedback) + reps x 45 trials x 1.15s SOA; was 5 w/ reps=4, retimed 2026-08-12 per PI request (tone down reps to reduce participant burnout)
  reps: 3   # each rep = the classic 45-trial sequence (9 numbers x 5 font sizes) -- lowered from 4 (2026-08-12, burnout concern)
  omit_count: 3          # how many numbers (1-9) are randomly chosen as no-press targets each run; set null to use omit_num instead
  omit_num: 3            # hardcoded no-press target number, only used if omit_count is null
  practice: true          # 18 practice trials w/ accuracy feedback before the real block
  fixed_order: false      # randomized (not sequential) presentation order
  baseline_duration_sec: 30   # pre-task physiological baseline

devices:
  mode: mock                      # mock | real — mock lets the app run with no hardware present
  skip_sync: true   # skip this app's own BLE device_sync step when hardware was already synced/verified externally before starting; overridable via --skip-device-sync
  ear_eeg_out:
    enabled: true
    name_prefix: "ESP_SPP_SERVER"
    protocol: gatt_struct
  ear_eeg_in:
    enabled: false                # in-ear firmware has no BLE sync yet — open item #2
    name_prefix: "ESP_SPP_SERVER"
    protocol: gatt_struct
  wristband:
    enabled: true
    name_prefix: "WristBand_"
    protocol: nus_text
  emotiv_flex:
    enabled: false                # integration method TBD — open item #1
    protocol: unknown

# Each item type (choice/numeric/rating/multi_rating/group) is handled generically by app/main.py's questionnaire runner. Disable any item/field without deleting it via `enabled: false`.
questionnaire:
  items:
    - id: age_range
      type: choice
      prompt: "What is your age range?"
      options: ["18-24", "25-34", "35-44", "45-54", "55-64", "65+"]

    - id: demographics   # combined gender/education/native-language screen
      type: group
      prompt: "A few quick demographic questions."
      fields:
        - id: gender
          type: choice
          prompt: "Gender:"
          options: ["Female", "Male", "Non-binary", "Prefer to self-describe", "Prefer not to say"]
        - id: gender_self_describe
          type: text
          prompt: "Please specify:"
          show_if: { field: gender, equals: "Prefer to self-describe" }
        - id: education
          type: dropdown
          prompt: "Highest level of education completed:"
          options: ["Less than high school", "High school diploma / GED", "Some college", "Bachelor's degree", "Graduate degree"]
        - id: native_language
          type: dropdown
          prompt: "Native language:"
          options: ["English", "Spanish", "Mandarin Chinese", "Hindi", "French", "Arabic", "Bengali", "Portuguese", "Russian", "Urdu", "Korean", "Vietnamese", "Other"]
        - id: native_language_other
          type: text
          prompt: "Please specify your native language:"
          show_if: { field: native_language, equals: "Other" }

    - id: handedness
      type: choice
      prompt: "Are you left-handed, right-handed, or ambidextrous?"
      options: ["Left-handed", "Right-handed", "Ambidextrous"]

    - id: sleep_hours_last_night
      type: numeric
      prompt: "How many hours did you sleep last night?"
    - id: caffeine_last_3h
      type: choice
      prompt: "Have you had caffeine in the last 3-5 hours?"
      options: ["Yes", "No"]
    - id: alcohol_last_24h
      type: choice
      prompt: "Have you consumed alcohol in the last 24 hours?"
      options: ["Yes", "No"]
      enabled: false
    - id: nicotine_today
      type: choice
      prompt: "Have you used nicotine/tobacco products today?"
      options: ["Yes", "No"]
      enabled: false

    - id: stai6   # STAI-6 (Marteau & Bekker, 1992): validated 6-item short-form state anxiety scale
      type: multi_rating
      enabled: true
      prompt: "For each statement, choose how you feel RIGHT NOW, at this moment."
      scale_min: 1
      scale_max: 4
      left_label: "Not at all"
      right_label: "Very much so"
      items:
        - id: stai_calm
          prompt: "I feel calm"
        - id: stai_tense
          prompt: "I am tense"
        - id: stai_upset
          prompt: "I feel upset"
        - id: stai_relaxed
          prompt: "I am relaxed"
        - id: stai_content
          prompt: "I feel content"
        - id: stai_worried
          prompt: "I am worried"

    - id: panas   # PANAS short form (I-PANAS-SF; Thompson, 2007): positive/negative affect items
      type: multi_rating
      enabled: false
      prompt: "Indicate to what extent you feel this way RIGHT NOW, at this moment."
      scale_min: 1
      scale_max: 5
      left_label: "Very slightly or not at all"
      right_label: "Extremely"
      items:
        - id: panas_active
          prompt: "Active"
        - id: panas_alert
          prompt: "Alert"
        - id: panas_attentive
          prompt: "Attentive"
        - id: panas_determined
          prompt: "Determined"
        - id: panas_inspired
          prompt: "Inspired"
        - id: panas_afraid
          prompt: "Afraid"
        - id: panas_ashamed
          prompt: "Ashamed"
        - id: panas_hostile
          prompt: "Hostile"
        - id: panas_nervous
          prompt: "Nervous"
        - id: panas_upset
          prompt: "Upset"

logging:
  session_root: "./demo_sessions"   # DEMO CONFIG: separate from real participant data in ./sessions; where session_id folders (events.jsonl, session_manifest.json, etc.) get written; set an absolute Windows path (with drive letter) to redirect elsewhere
