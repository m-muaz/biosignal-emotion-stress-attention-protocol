<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Stroop Test</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <div id="trial-hint"></div>
    <div id="key-hint">Click (or press its number) for the INK color &nbsp;|&nbsp; B = skip trial &nbsp;|&nbsp; ESC = quit</div>
  </div>

  <div id="instructions-screen" class="screen hidden">
    <div id="instructions-text"></div>
    <div class="hint" id="instructions-hint">Press SPACE to begin.</div>
  </div>

  <div id="rest-screen" class="screen hidden">
    <div class="fixation-cross">+</div>
    <div class="fixation-progress-track"><div class="fixation-progress-fill" id="rest-progress"></div></div>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="stimulus-word"></div>
    <div id="color-buttons"></div>
  </div>

  <div id="end-screen" class="screen hidden">
    <div id="end-heading">Trial complete</div>
    <div id="end-stats"></div>
    <div class="hint">Press SPACE to continue</div>
  </div>

  <script src="../shared/clock_sync.js"></script>
  <script src="game.js"></script>
</body>
</html>
