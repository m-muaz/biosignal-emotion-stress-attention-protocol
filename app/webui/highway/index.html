<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Highway Dodge</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="hud">
    <div id="score">Avoided: <span id="score-value">0</span> &nbsp;|&nbsp; Collisions: <span id="collision-value">0</span></div>
    <div id="key-hint">&larr; &rarr; = dodge &nbsp;|&nbsp; B = skip block &nbsp;|&nbsp; ESC = quit</div>
  </div>

  <div id="rest-screen" class="screen hidden">
    <div class="fixation-cross">+</div>
    <div class="fixation-progress-track"><div class="fixation-progress-fill" id="rest-progress"></div></div>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="road">
      <div id="obstacle-field"></div>
      <div id="player-car">&#128663;</div>
    </div>
  </div>

  <div id="end-screen" class="screen hidden">
    <div id="end-heading">Drive complete</div>
    <div id="end-score"></div>
    <div class="hint">Press SPACE to continue</div>
  </div>

  <!-- Block-level self-report, shown between driving blocks -- markup/CSS
       copied verbatim from app/webui/video_player/index.html + style.css so
       app/webui/shared/rating_widget.js (shared with the emotion task) can
       render into it unchanged. -->
  <div id="rating-screen" class="screen hidden">
    <div id="rating-rows"></div>
    <div class="hint">Click a number for each row, then press ENTER/SPACE to continue.</div>
  </div>

  <script src="../shared/clock_sync.js"></script>
  <script src="../shared/rating_widget.js"></script>
  <script src="game.js"></script>
</body>
</html>
